[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ballistic-simulation-engine"
version = "1.0.0"
authors = [
  { name="Utkarsh Dwivedi" },
]
description = "A Physics-Informed Neural Network surrogate for macroscopic ballistic penetration simulation."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "numba>=0.57",
    "torch>=2.0",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff", "mypy"]
demos = ["streamlit", "gradio"]

[project.urls]
"Homepage" = "https://github.com/utkdwivedi/Ballistic-Simulation-Engine"
"Bug Tracker" = "https://github.com/utkdwivedi/Ballistic-Simulation-Engine/issues"

[tool.setuptools.packages.find]
include = ["ballistic*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
