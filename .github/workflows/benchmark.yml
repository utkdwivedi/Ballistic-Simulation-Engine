# .github/workflows/benchmark.yml

name: GPU Benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}  # only run on manual trigger
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install NVIDIA driver (CUDA)
        uses: Jimver/cuda-toolkit@v0.2.14
        with:
          cuda: "12.1"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow matplotlib seaborn numba torch==2.3.0+cu121 torchvision torchaudio --extra-index-url https://download.pytorch.org/whl/cu121
      - name: Run GPU benchmark
        run: |
          python scripts/validate_gpu_benchmark.py
            2> benchmark.out
      - name: Archive benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: gpu-benchmark
          path: reports/benchmarks/gpu_benchmark.csv
